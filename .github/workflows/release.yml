name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/android/cmdline-tools"
          wget -q -O /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mkdir -p "$HOME/android/cmdline-tools/latest"
          mv /tmp/cmdline-tools-extract/cmdline-tools/* "$HOME/android/cmdline-tools/latest/"
          echo "ANDROID_HOME=$HOME/android" >> "$GITHUB_ENV"
          echo "$HOME/android/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0"

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret KEYSTORE_BASE64." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          KEYSTORE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD." >&2
            exit 1
          fi
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          unset FRAMEWORK_RES
          version="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1)"
          export FINAL_APK="$GITHUB_WORKSPACE/DexPlus-${version}.apk"
          chmod +x ./build.sh
          ./build.sh

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: DexPlus-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
